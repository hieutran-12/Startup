# Môi trường local: PostgreSQL + RustFS (S3-compatible, thay cho MinIO đã ngừng phát triển)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: thiepcuoi
      POSTGRES_PASSWORD: thiepcuoi
      POSTGRES_DB: thiepcuoi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thiepcuoi -d thiepcuoi"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: thiepcuoi
      RUSTFS_SECRET_KEY: thiepcuoi-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  storage-data:
