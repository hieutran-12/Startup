# CI và deploy API (README › Lên production › Phát hành phiên bản mới)
# - Pull request và mọi lần push: ruff, alembic check, pytest với PostgreSQL 16.
# - Push lên main (hoặc chạy tay ở tab Actions): build image arm64, đẩy lên ECR với tag là commit,
#   rồi qua SSM bảo EC2 đổi API_IMAGE, chạy migration, khởi động lại, kiểm tra /health, chạy seed.
#   API mới không khỏe thì quay lại image cũ. Commit chỉ sửa tài liệu (docs/, *.md) thì không deploy.
# - Đăng nhập AWS bằng OIDC, không có khoá AWS trên GitHub. Role thiepcuoi-github-deploy chỉ nhận
#   repo hieutran-12/Startup nhánh main; ARN của role nằm ở biến AWS_ROLE_ARN của repo
#   (Settings › Secrets and variables › Actions › Variables).
name: CI và deploy API

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR mới đẩy lên thì huỷ lần chạy cũ; deploy main thì chạy lần lượt, không huỷ giữa chừng
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thiepcuoi
          POSTGRES_PASSWORD: thiepcuoi
          POSTGRES_DB: thiepcuoi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U thiepcuoi -d thiepcuoi_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://thiepcuoi:thiepcuoi@localhost:5432/thiepcuoi_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7" # cùng phiên bản với Dockerfile
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Model khớp migration
        env:
          DATABASE_URL: postgresql+asyncpg://thiepcuoi:thiepcuoi@localhost:5432/thiepcuoi_test
        run: uv run alembic upgrade head && uv run alembic check
      - run: uv run pytest -q

  deploy:
    needs: test
    if: >-
      github.repository == 'hieutran-12/Startup' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04-arm # cùng kiến trúc với EC2 t4g (Graviton)
    permissions:
      contents: read
      id-token: write # lấy token OIDC để đăng nhập AWS
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPOSITORY: thiepcuoi-api
      INSTANCE_NAME: thiepcuoi-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Có thay đổi ngoài tài liệu không
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" HEAD | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Chỉ đổi tài liệu: bỏ qua deploy"
          fi

      - name: Che số tài khoản AWS trong log (repo public, log ai cũng xem được)
        if: steps.changes.outputs.deploy == 'true'
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "Thiếu biến AWS_ROLE_ARN: Settings › Secrets and variables › Actions › Variables"
            exit 1
          fi
          echo "::add-mask::$(echo "$ROLE_ARN" | cut -d: -f5)"

      - name: Đăng nhập AWS bằng OIDC
        if: steps.changes.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Cài AWS CLI nếu máy chạy chưa có
        if: steps.changes.outputs.deploy == 'true'
        run: |
          if ! command -v aws >/dev/null; then
            curl -sSfL https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install
          fi
          aws --version

      - name: Đăng nhập ECR
        if: steps.changes.outputs.deploy == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build và đẩy image (tag là commit)
        if: steps.changes.outputs.deploy == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          TAG=$(git rev-parse --short=7 HEAD)
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # ECR không cho ghi đè tag: chạy lại cùng commit thì dùng image đã có
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image $TAG đã có trên ECR"
            exit 0
          fi
          docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"

      - name: Deploy lên EC2 qua SSM
        if: steps.changes.outputs.deploy == 'true'
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          test "$INSTANCE_ID" != None
          # Lệnh chạy trên EC2 bằng sh (AWS-RunShellScript): không dùng cú pháp riêng của bash
          cat > /tmp/deploy.sh <<'EOF'
          set -eu
          TAG=__TAG__
          F=docker-compose.prod.yml
          cd /opt/thiepcuoi
          OLD=$(sed -n 's#^API_IMAGE=.*thiepcuoi-api:##p' .env)
          echo "Image cũ: $OLD, image mới: $TAG"
          sed -i "s#^\(API_IMAGE=.*thiepcuoi-api:\).*#\1$TAG#" .env
          docker compose -f $F pull -q
          docker compose -f $F run --rm api alembic upgrade head
          docker compose -f $F up -d
          ok=0
          for i in $(seq 1 30); do
            if curl -fs localhost:8000/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            docker compose -f $F logs --tail 50 api
            sed -i "s#^\(API_IMAGE=.*thiepcuoi-api:\).*#\1$OLD#" .env
            docker compose -f $F up -d
            echo "API mới không khỏe: đã quay lại image $OLD"
            exit 1
          fi
          docker compose -f $F exec -T api python -m app.scripts.seed_templates
          docker image prune -af --filter "until=168h" >/dev/null 2>&1 || true
          echo "Đang chạy image $TAG"
          EOF
          sed -i "s/__TAG__/$TAG/" /tmp/deploy.sh
          PARAMS=$(jq -n --rawfile s /tmp/deploy.sh '{commands: [$s], executionTimeout: ["900"]}')
          CID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy $TAG" --parameters "$PARAMS" --query Command.CommandId --output text)
          ST=Pending
          for i in $(seq 1 120); do
            sleep 5
            ST=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text | tail -20
          echo "Trạng thái: $ST"
          test "$ST" = Success

      - name: Kiểm tra từ Internet
        if: steps.changes.outputs.deploy == 'true'
        run: curl -fsS --retry 5 --retry-delay 3 https://api.ketduyen.me/health
