# Production trên một VPS: Caddy (HTTPS) + API + PostgreSQL + RustFS. Hướng dẫn: README › Lên production.
#   cp .env.production.example .env        rồi điền giá trị
#   docker compose -f docker-compose.prod.yml up -d --build
# Chỉ Caddy mở cổng ra ngoài (80, 443). PostgreSQL và RustFS chỉ nghe trong mạng nội bộ của compose.
# Giới hạn log của mỗi container (mặc định Docker ghi không giới hạn, lâu ngày đầy ổ đĩa)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Thieu API_DOMAIN trong .env}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?Thieu MEDIA_DOMAIN trong .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # chứng chỉ HTTPS: mất volume này thì Caddy phải xin lại
      - caddy-config:/config
    networks:
      default:
        # API gọi storage bằng đúng domain công khai (URL presigned ký theo domain này); alias giữ
        # request đó đi trong mạng nội bộ thay vì vòng ra Internet
        aliases:
          - ${MEDIA_DOMAIN}
    depends_on:
      - api
      - storage

  api:
    build: .
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      # Mật khẩu chỉ gồm chữ và số (nằm trong URL); host là tên service trong compose
      DATABASE_URL: postgresql+asyncpg://thiepcuoi:${POSTGRES_PASSWORD:?Thieu POSTGRES_PASSWORD trong .env}@postgres:5432/thiepcuoi
      S3_ENDPOINT_URL: https://${MEDIA_DOMAIN}
      S3_REGION: auto
      S3_BUCKET: thiepcuoi-media
      MEDIA_PUBLIC_BASE_URL: https://${MEDIA_DOMAIN}/thiepcuoi-media
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: thiepcuoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: thiepcuoi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thiepcuoi -d thiepcuoi"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    logging: *logging
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Thieu S3_ACCESS_KEY_ID trong .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Thieu S3_SECRET_ACCESS_KEY trong .env}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - storage-data:/data

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  storage-data:
