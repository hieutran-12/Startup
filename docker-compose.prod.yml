# Production và staging của API trên AWS EC2. Hướng dẫn: README › Lên production.
#   api.ketduyen.me         → Nginx → upstream thiepcuoi_production → api-blue (127.0.0.1:8000)
#                                                                   hoặc api-green (127.0.0.1:8002)
#   api-staging.ketduyen.me → Nginx → api-staging (127.0.0.1:8001)
#   Database: RDS PostgreSQL (database riêng cho mỗi môi trường). File: S3 private, đọc qua CloudFront.
# Blue-green: deploy/deploy.sh chạy màu đang nghỉ bằng image mới, kiểm tra, rồi đổi upstream của
# Nginx (không gián đoạn). Không gọi `docker compose up -d` cho cả file: luôn đi qua deploy.sh.
#
# File trong /opt/thiepcuoi (không có trong git, quyền 600):
#   .env            biến cho compose: API_REPOSITORY, API_IMAGE_BLUE, API_IMAGE_GREEN,
#                   API_IMAGE_STAGING (deploy.sh ghi tag vào đây)
#   production.env  cấu hình app production; staging.env: cấu hình app staging
#                   (mẫu: .env.production.example)

# Giới hạn log của mỗi container (mặc định Docker ghi không giới hạn, lâu ngày đầy ổ đĩa)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Khuôn chung cho 3 service API (YAML anchor, mỗi service gộp vào bằng `<<: *api`)
x-api: &api
  restart: unless-stopped
  logging: *logging
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s

# Giá trị ở đây thắng giá trị trong file env_file, nên không đặt các key này trong *.env
x-api-environment: &api-environment
  COOKIE_SECURE: "true"
  # AWS S3: không endpoint, không key → boto3 dùng IAM role của EC2.
  # "Hop limit" metadata của EC2 phải là 2, nếu không container không lấy được role.
  S3_ENDPOINT_URL: ""
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  S3_REGION: ap-southeast-2

services:
  api-blue:
    <<: *api
    image: ${API_IMAGE_BLUE:?Thieu API_IMAGE_BLUE trong .env}
    # Chỉ Nginx trên cùng EC2 gọi được; cổng không mở ra Internet
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: production.env
        required: false # deploy.sh tự kiểm tra trước khi chạy
    environment:
      <<: *api-environment
      APP_ENV: production

  api-green:
    <<: *api
    image: ${API_IMAGE_GREEN:?Thieu API_IMAGE_GREEN trong .env}
    ports:
      - "127.0.0.1:8002:8000"
    env_file:
      - path: production.env
        required: false
    environment:
      <<: *api-environment
      APP_ENV: production

  api-staging:
    <<: *api
    image: ${API_IMAGE_STAGING:?Thieu API_IMAGE_STAGING trong .env}
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - path: staging.env
        required: false
    environment:
      <<: *api-environment
      APP_ENV: staging
