# Production trên AWS EC2. Hướng dẫn: README › Lên production.
#   Internet → Nginx (trên EC2, docker/nginx-api.conf) → API (container này, 127.0.0.1:8000)
#   Database: RDS PostgreSQL. File: S3 private, đọc qua CloudFront.
# Trên EC2, trong thư mục chứa file này và .env:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

# Giới hạn log của mỗi container (mặc định Docker ghi không giới hạn, lâu ngày đầy ổ đĩa)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    # Image on ECR, tag  = commit hash (Put in .env)
    image: ${API_IMAGE:?Thieu API_IMAGE trong .env}
    restart: unless-stopped
    logging: *logging
    # Only Nginx on the same EC2 can reach the API. Port 8000 is not open to the Internet.
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    # Values here win over .env, so do not put these keys in .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      # Stop early if .env misses one (the app defaults point to localhost)
      DATABASE_URL: ${DATABASE_URL:?Thieu DATABASE_URL trong .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Thieu CORS_ORIGINS trong .env}
      S3_BUCKET: ${S3_BUCKET:?Thieu S3_BUCKET trong .env}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:?Thieu MEDIA_PUBLIC_BASE_URL trong .env}
      # AWS S3: no endpoint and no keys -> boto3 uses the IAM role of the EC2 instance.
      # The EC2 metadata "hop limit" must be 2, or the container cannot get the role.
      S3_ENDPOINT_URL: ""
      S3_ACCESS_KEY_ID: ""
      S3_SECRET_ACCESS_KEY: ""
      S3_REGION: ap-southeast-2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
