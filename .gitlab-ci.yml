# Pipeline CI/CD của backend trên GitLab (README › Lên production › CI/CD).
#
#   Merge Request:  lint → test
#   Nhánh main:     lint → test → build → deploy-staging → smoke-staging → deploy-production (▶ bấm tay)
#
# Đăng nhập AWS bằng OIDC (không lưu khoá AWS ở GitLab): job xin GitLab một JWT (id_tokens), đổi
# lấy khoá tạm 1 giờ của role thiepcuoi-gitlab-ci. Role chỉ nhận JWT của project
# ketduyen/thiepcuoi-api, nhánh main. ARN của role: biến CI/CD AWS_ROLE_ARN (Settings › CI/CD › Variables).

# Thứ tự các stage. Job cùng stage chạy song song; stage sau chỉ chạy khi stage trước qua hết.
stages:
  - lint
  - test
  - build
  - staging
  - production

# Khi nào tạo pipeline (xét trước mọi job, gặp luật khớp đầu tiên thì dừng):
workflow:
  rules:
    # 1. Có Merge Request: pipeline gắn với MR (kết quả hiện ngay trong MR)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 2. Push lên nhánh đang có MR mở: bỏ, đã có pipeline của MR (tránh chạy 2 lần)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # 3. Push lên nhánh bất kỳ (gồm main): pipeline của nhánh
    - if: $CI_COMMIT_BRANCH

default:
  # Python 3.13 + uv đúng bản Dockerfile đang dùng (0.13.7), để CI giống production
  image: ghcr.io/astral-sh/uv:0.13.7-python3.13-trixie-slim
  # Có commit mới cùng nhánh thì huỷ pipeline cũ đang chạy dở (job deploy tắt cái này)
  interruptible: true

variables:
  UV_CACHE_DIR: .uv-cache
  UV_PYTHON_DOWNLOADS: never
  AWS_DEFAULT_REGION: ap-southeast-2
  ECR_REPOSITORY: thiepcuoi-api
  # Tag image = 8 ký tự đầu của commit: biết ngay image nào build từ code nào
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

# ---------- Job mẫu (tên bắt đầu bằng dấu chấm: không tự chạy, job khác dùng qua `extends`) ----------

.uv-project:
  cache:
    # Khoá cache theo uv.lock: thư viện không đổi thì dùng lại, đổi thì tạo cache mới
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    # --locked: uv.lock phải khớp pyproject.toml, lệch thì lỗi chứ không tự sửa
    - uv sync --locked

# Chỉ chạy trên nhánh main (build, deploy); pipeline của MR không có các job này
.main-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Đăng nhập AWS bằng OIDC. Image phải là Alpine (dùng apk).
.aws-login:
  id_tokens:
    # GitLab ký một JWT, `aud` phải khớp điều kiện trong trust policy của role
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli bash >/dev/null
    # Đổi JWT lấy khoá tạm (AccessKeyId, SecretAccessKey, SessionToken) rồi đặt thành biến môi trường
    - >
      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s"
      $(aws sts assume-role-with-web-identity
      --role-arn "$AWS_ROLE_ARN"
      --role-session-name "gitlab-${CI_PIPELINE_ID}-${CI_JOB_ID}"
      --web-identity-token "$AWS_ID_TOKEN"
      --duration-seconds 3600
      --query "Credentials.[AccessKeyId,SecretAccessKey,SessionToken]"
      --output text))
    - aws sts get-caller-identity --query Arn --output text

# Deploy qua SSM (deploy/ssm-run.sh → deploy/deploy.sh trên EC2)
.deploy:
  extends: [.main-only, .aws-login]
  image: alpine:3.20
  # Không huỷ giữa chừng khi có commit mới: deploy dở dang nguy hiểm hơn deploy xong
  interruptible: false
  script:
    - bash deploy/ssm-run.sh "$DEPLOY_ENV" "$IMAGE_TAG"

# ---------- Stage lint, test: chạy cho mọi MR và nhánh ----------

lint:
  stage: lint
  extends: .uv-project
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  extends: .uv-project
  # Container PostgreSQL 16 chạy kèm job, gọi tới bằng tên máy "postgres"
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: thiepcuoi
    POSTGRES_PASSWORD: thiepcuoi
    POSTGRES_DB: thiepcuoi_test
    TEST_DATABASE_URL: postgresql+asyncpg://thiepcuoi:thiepcuoi@postgres:5432/thiepcuoi_test
  script:
    - DATABASE_URL=$TEST_DATABASE_URL uv run alembic upgrade head
    - DATABASE_URL=$TEST_DATABASE_URL uv run alembic check
    - uv run pytest -q --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

# ---------- Stage build: image arm64 lên ECR ----------

build:
  stage: build
  extends: [.main-only, .aws-login]
  # Máy chạy ARM của GitLab (gói Free có): cùng kiến trúc với EC2 Graviton, build không cần giả lập
  tags: [saas-linux-small-arm64]
  image: docker:27
  # Docker-in-Docker: daemon Docker chạy trong container phụ để job dùng `docker build`.
  # --mtu=1400: tài liệu GitLab khuyên cho runner ARM (tránh lỗi mạng khi tải gói)
  services:
    - name: docker:27-dind
      command: ["--mtu=1400"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
    # ECR không cho ghi đè tag: chạy lại pipeline của cùng commit thì dùng image đã có
    - |
      if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
        echo "Image $IMAGE_TAG đã có trên ECR, bỏ qua build"
        exit 0
      fi
    - docker build -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
    - docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

# ---------- Stage staging: deploy tự động rồi smoke test ----------

deploy-staging:
  stage: staging
  extends: .deploy
  needs: [build]
  # Mỗi lúc chỉ một job được deploy vào staging (job sau xếp hàng chờ)
  resource_group: staging
  environment:
    name: staging
    url: https://api-staging.ketduyen.me
  variables:
    DEPLOY_ENV: staging

smoke-staging:
  stage: staging
  extends: .main-only
  needs: [deploy-staging]
  # Chỉ dùng thư viện chuẩn của Python có sẵn trong image mặc định, không cần uv sync
  script:
    - python3 -I scripts/smoke_test.py https://api-staging.ketduyen.me

# ---------- Stage production: cổng duyệt bằng tay, blue-green ----------

deploy-production:
  stage: production
  extends: .deploy
  needs: [smoke-staging]
  resource_group: production
  environment:
    name: production
    url: https://api.ketduyen.me
  variables:
    DEPLOY_ENV: production
  # Cổng duyệt: job đứng chờ nút ▶. Nhánh main được bảo vệ nên chỉ người có quyền merge vào
  # main mới bấm được. allow_failure: false để pipeline hiện "đang chờ duyệt" thay vì "xong".
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  allow_failure: false
