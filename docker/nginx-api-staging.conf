# Reverse proxy for the staging API on EC2 (service api-staging in docker-compose.prod.yml, 127.0.0.1:8001).
# Install on EC2:
#   sudo cp docker/nginx-api-staging.conf /etc/nginx/conf.d/thiepcuoi-api-staging.conf
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d api-staging.ketduyen.me --redirect
#   (DNS: A record api-staging -> Elastic IP of the EC2)

server {
    listen 80;
    listen [::]:80;
    server_name api-staging.ketduyen.me;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
