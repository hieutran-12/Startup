# Reverse proxy for the API on EC2 (docker-compose.prod.yml). Nginx runs on the EC2 host, not in Docker
# Install on EC2:
#   sudo cp docker/nginx-api.conf /etc/nginx/conf.d/thiepcuoi-api.conf
#   change api.example.com to your API domain in that copy
#   sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d <your API domain>
#   (certbot adds the port 443 part and the HTTP -> HTTPS redirect by itself)

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # API requests are small JSON. Photos and music go straight from the browser to S3, not here.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Nginx is the first hop: set the client IP, do not append to what the client sent
        proxy_set_header X-Forwarded-For $remote_addr;
        # Tells the API the original request was https (uvicorn runs with --proxy-headers)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
